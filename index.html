<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c4736a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Приглашения" />
    <title>Приглашение</title>
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      * { box-sizing: border-box; }

      /* Admin table — desktop row, mobile card */
      .admin-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .admin-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .admin-actions { display: flex; gap: 6px; justify-content: flex-end; margin-left: auto; }
      @media (max-width: 680px) {
        .admin-row { flex-direction: column; align-items: stretch; }
        .admin-meta { justify-content: flex-start; }
        .admin-actions { justify-content: flex-start; margin-left: 0; }
        .rsvp-grid { grid-template-columns: 1fr !important; gap: 28px !important; }
      }

      /* ── Landing polish ───────────────────────────────────────── */
      html { scroll-behavior: smooth; }
      ::selection { background: #c4736a33; }

      @keyframes meshDrift {
        0%   { transform: translate3d(0,0,0) scale(1); }
        50%  { transform: translate3d(2%,-4%,0) scale(1.12); }
        100% { transform: translate3d(0,0,0) scale(1); }
      }
      @keyframes floaty {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-12px); }
      }
      @keyframes revealUp {
        from { opacity: 0; transform: translateY(26px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .reveal { opacity: 0; }
      .reveal.in { animation: revealUp .7s cubic-bezier(.2,.7,.2,1) forwards; }

      .lift { transition: transform .28s cubic-bezier(.2,.7,.2,1), box-shadow .28s, border-color .28s; }
      .lift:hover { transform: translateY(-6px); box-shadow: 0 20px 44px rgba(40,30,28,.12); border-color: #d9b8af !important; }

      .tile-pop { transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s; }
      .tile-pop:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 16px 34px rgba(40,30,28,.14); }

      .btn-shine { position: relative; overflow: hidden; transition: transform .2s ease, box-shadow .2s ease, filter .2s ease; }
      .btn-shine:hover { transform: translateY(-2px); filter: brightness(1.04); }
      .btn-shine::after {
        content: ""; position: absolute; top: 0; left: -130%; width: 55%; height: 100%;
        background: linear-gradient(120deg, transparent, rgba(255,255,255,.45), transparent);
        transform: skewX(-20deg);
      }
      .btn-shine:hover::after { animation: shine .85s forwards; }
      @keyframes shine { to { left: 150%; } }

      .float-chip { animation: floaty 6s ease-in-out infinite; }
      @media (max-width: 820px) { .float-chip { display: none !important; } }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .reveal, .reveal.in { animation: none !important; opacity: 1 !important; }
        .float-chip, [data-mesh] { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
