<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c4736a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Приглашения" />
    <title>Приглашение</title>
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      * { box-sizing: border-box; }

      /* Admin table — desktop row, mobile card */
      .admin-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .admin-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .admin-actions { display: flex; gap: 6px; justify-content: flex-end; margin-left: auto; }
      @media (max-width: 680px) {
        .admin-row { flex-direction: column; align-items: stretch; }
        .admin-meta { justify-content: flex-start; }
        .admin-actions { justify-content: flex-start; margin-left: 0; }
        .rsvp-grid { grid-template-columns: 1fr !important; gap: 28px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
